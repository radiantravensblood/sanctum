name: Velastra Contracts

on:
  push:
    paths:
      - "labs/velastra/painter/**"
      - "labs/velastra/tests/**"
      - "src/velastra/**"
      - "src/visual/scene.js"
      - "src/renderer.js"
      - "src/app.js"
      - "world/velastra-atelier.json"
      - "world/velastra-assets.json"
      - "world/velastra-brushes.json"
      - "world/velastra-style.json"
      - "world/velastra-painterly-truth.json"
      - "world/velastra-evidence.json"
      - ".devcontainer/**"
      - "authoring/inbox/README.md"
      - ".gitignore"
  pull_request:
    paths:
      - "labs/velastra/painter/**"
      - "labs/velastra/tests/**"
      - "src/velastra/**"
      - "src/visual/scene.js"
      - "src/renderer.js"
      - "src/app.js"
      - "world/velastra-atelier.json"
      - "world/velastra-assets.json"
      - "world/velastra-brushes.json"
      - "world/velastra-style.json"
      - "world/velastra-painterly-truth.json"
      - "world/velastra-evidence.json"
      - ".devcontainer/**"
      - "authoring/inbox/README.md"
      - ".gitignore"

jobs:
  painter-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile labs/velastra/painter/velastra_painter.py
      - name: Run painter contract tests
        run: python -m unittest labs/velastra/painter/test_velastra_painter.py
      - name: Check authoring module syntax
        run: node --check src/velastra/authoring.js
      - name: Check Painterly Truth integration syntax
        run: |
          node --check src/world.js
          node --check src/velastra/painterly-truth.js
          node --check src/velastra/evidence.js
          node --check src/velastra/scene-packet.js
          node --check src/velastra/sanctum-atelier.js
          node --check src/velastra/index.js
      - name: Run living canvas contract
        run: node labs/velastra/tests/living-canvas.mjs
      - name: Run brush cabinet contract
        run: node labs/velastra/tests/brush-cabinet.mjs
      - name: Run cloud atelier contract
        run: node labs/velastra/tests/cloud-atelier.mjs
      - name: Run Virynism hand contract
        run: node labs/velastra/tests/virynism-hand.mjs
      - name: Run painterly truth contract
        run: node labs/velastra/tests/painterly-truth.mjs
      - name: Run brush contract + visible evidence
        run: node labs/velastra/tests/brush-contract.mjs
